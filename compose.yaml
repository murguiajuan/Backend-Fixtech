version: "3.8"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: fixtech_db
      MYSQL_USER: ${MYSQL_USER:-fixtech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/fixtech_db.sql:/docker-entrypoint-initdb.d/01-fixtech.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - fixtech

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      FIXTECH_DB_URL: jdbc:mysql://mysql:3306/fixtech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      FIXTECH_DB_USER: ${MYSQL_USER:-fixtech}
      FIXTECH_DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
      FIXTECH_JWT_SECRET: ${FIXTECH_JWT_SECRET:?Defina FIXTECH_JWT_SECRET en .env}
      FIXTECH_ARCHIVOS_DIR: /app/uploads
      FIXTECH_OPENAPI_HABILITADO: ${FIXTECH_OPENAPI_HABILITADO:-true}
      FIXTECH_CORREO_HABILITADO: ${FIXTECH_CORREO_HABILITADO:-false}
      FIXTECH_CORREO_REMITENTE: ${FIXTECH_CORREO_REMITENTE:-no-reply@fixtech.pe}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      TZ: America/Lima
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - fixtech

volumes:
  mysql_data:
  uploads_data:

networks:
  fixtech:
    driver: bridge
