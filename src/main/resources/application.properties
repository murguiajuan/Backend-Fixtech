spring.application.name=fixtech
spring.profiles.default=dev

# Valores por defecto para XAMPP local; en otros entornos se sobrescriben con variables de entorno.
spring.datasource.url=${FIXTECH_DB_URL:jdbc:mysql://localhost:3306/fixtech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${FIXTECH_DB_USER:root}
spring.datasource.password=${FIXTECH_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Los archivos se guardan fuera de la carpeta pública y se sirven mediante endpoints autorizados.
app.archivos.directorio=${FIXTECH_ARCHIVOS_DIR:uploads}
app.archivos.max-imagen-bytes=5242880
app.archivos.max-dimension=1600
app.archivos.calidad-jpeg=0.8

# Frecuencia del job que marca solicitudes vencidas.
app.solicitudes.vencimiento-intervalo-ms=60000

# Frecuencia del job que confirma servicios finalizados a las 48 horas.
app.servicios.conformidad-intervalo-ms=60000

# Frecuencia del job que evalúa y actualiza el bloqueo por deuda de comisiones.
app.comisiones.deuda-intervalo-ms=60000

# Notificaciones por correo: se habilitan al configurar SPRING_MAIL_* y esta bandera.
app.notificaciones.correo.habilitado=${FIXTECH_CORREO_HABILITADO:false}
app.notificaciones.correo.remitente=${FIXTECH_CORREO_REMITENTE:no-reply@fixtech.pe}

# Recuperación de contraseña mediante OTP.
app.recuperacion.codigo-minutos=${FIXTECH_OTP_CODIGO_MINUTOS:10}
app.recuperacion.ticket-minutos=${FIXTECH_OTP_TICKET_MINUTOS:10}
app.recuperacion.max-intentos=${FIXTECH_OTP_MAX_INTENTOS:5}
app.recuperacion.reenvio-segundos=${FIXTECH_OTP_REENVIO_SEGUNDOS:60}
app.recuperacion.max-solicitudes-por-correo=${FIXTECH_OTP_MAX_SOLICITUDES_CORREO:3}
app.recuperacion.max-solicitudes-por-ip=${FIXTECH_OTP_MAX_SOLICITUDES_IP:10}
app.recuperacion.ventana-minutos=${FIXTECH_OTP_VENTANA_MINUTOS:15}
app.recuperacion.limpieza-intervalo-ms=${FIXTECH_OTP_LIMPIEZA_MS:3600000}

# El esquema se gestiona con fixtech_db.sql; Flyway se habilitará cuando exista la migración V1.
spring.flyway.enabled=false

# El secreto real se define en application-dev.properties (ignorado) o en FIXTECH_JWT_SECRET.
app.jwt.secret=${FIXTECH_JWT_SECRET:}
app.jwt.issuer=fixtech
app.jwt.access-token-minutos=15
app.jwt.refresh-token-dias=7

# Documentación OpenAPI/Swagger. En producción se deshabilita con el perfil prod.
springdoc.api-docs.enabled=${FIXTECH_OPENAPI_HABILITADO:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${FIXTECH_OPENAPI_HABILITADO:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Detrás de un proxy inverso confiable (Nginx, balanceador o Docker).
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.port=${SERVER_PORT:8082}

# Orígenes permitidos para la SPA Angular en desarrollo.
app.cors.allowed-origins=${FIXTECH_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
